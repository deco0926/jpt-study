<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f7fb" />
  <title>JPT 學習資料庫</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="database-page">
  <main class="container">
    <header class="hero database-hero">
      <div>
        <p class="eyebrow">JPT Study Database</p>
        <h1>學習資料庫</h1>
        <p class="muted">把已經學過的內容整理在這裡，隨時回來快速複習。</p>
      </div>
    </header>

    <nav class="top-nav" aria-label="主要導覽">
      <a class="nav-link" href="./index.html">今日學習</a>
      <a class="nav-link active" href="./database.html">學習資料庫</a>
    </nav>

    <section class="card quick-panel">
      <div class="quick-panel-head">
        <div>
          <p class="eyebrow">Quick Access</p>
          <h2>快速尋找</h2>
        </div>
        <span class="desktop-shortcut">按 <kbd>/</kbd> 可直接搜尋</span>
      </div>

      <div class="global-search-wrap">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="globalSearch" class="global-search" type="search"
          placeholder="搜尋假名、單字、讀音、中文或文法，例如：駅、車站、ました" />
        <button id="clearGlobalSearch" class="search-clear hidden" type="button">清除</button>
      </div>

      <div id="globalSearchResults" class="global-results hidden"></div>

      <div class="jump-links" aria-label="快速前往">
        <a href="#kana-section"><span>あ</span><strong>五十音</strong></a>
        <a href="#vocab-section"><span>単</span><strong>單字庫</strong></a>
        <a href="#grammar-section"><span>文</span><strong>文法庫</strong></a>
      </div>
    </section>

    <section class="card db-intro">
      <div class="section-head">
        <div>
          <p class="eyebrow">Overview</p>
          <h2>目前收錄</h2>
        </div>
        <span class="badge">持續更新</span>
      </div>
      <div class="db-stats">
        <div><strong id="kanaCount">0</strong><span>基本假名</span></div>
        <div><strong id="vocabCount">0</strong><span>已學單字</span></div>
        <div><strong id="grammarCount">0</strong><span>文法重點</span></div>
      </div>
    </section>

    <section class="card db-section" id="kana-section">
      <div class="section-head">
        <div>
          <p class="eyebrow">Kana</p>
          <h2>五十音總表</h2>
        </div>
        <button id="randomKanaBtn" class="mini-btn">隨機抽一題</button>
      </div>

      <div class="segmented" id="kanaMode">
        <button class="seg-btn active" data-mode="both">平假名＋片假名</button>
        <button class="seg-btn" data-mode="hiragana">平假名</button>
        <button class="seg-btn" data-mode="katakana">片假名</button>
      </div>

      <div id="randomKanaBox" class="random-box hidden">
        <span class="muted">這個假名怎麼念？</span>
        <strong id="randomKanaChar">ア</strong>
        <button id="revealKanaBtn" class="ghost">顯示答案</button>
        <p id="randomKanaAnswer" class="result"></p>
      </div>

      <div class="gojuon-wrap">
        <div id="gojuonTable" class="gojuon-table"></div>
      </div>

      <div class="notes">
        <strong>易混淆：</strong>
        シ = shi ／ ツ = tsu ／ ソ = so ／ ン = n ／ ル = ru ／ レ = re
      </div>
    </section>

    <section class="card db-section" id="vocab-section">
      <div class="section-head">
        <div>
          <p class="eyebrow">Vocabulary</p>
          <h2>已學單字庫</h2>
        </div>
        <span id="vocabVisibleCount" class="count-label"></span>
      </div>
      <input id="vocabSearch" class="db-search" type="search"
        placeholder="只搜尋單字庫，例如：車站、えき、駅" />
      <div id="vocabDb" class="db-list"></div>
    </section>

    <section class="card db-section" id="grammar-section">
      <div class="section-head">
        <div>
          <p class="eyebrow">Grammar</p>
          <h2>已學文法庫</h2>
        </div>
      </div>
      <div id="grammarDb" class="db-list grammar-grid"></div>
    </section>
  </main>

  <button id="backTop" class="back-top hidden" type="button" aria-label="回到頁面頂端">↑</button>

  <script src="./database.js"></script>
</body>
</html>
