name: Daily JPT evening exam

on:
  schedule:
    # 11:00 UTC = 19:00 Taiwan time (Asia/Taipei)
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evening-exam
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Refresh main branch
        run: git pull --ff-only origin main

      - name: Check whether today's exam is needed
        id: exam
        run: |
          TODAY="$(TZ=Asia/Taipei date +'%Y-%m-%d')"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ ! -f "site/exams/${TODAY}.json" ]; then
            echo "generate=true" >> "$GITHUB_OUTPUT"
          else
            echo "generate=false" >> "$GITHUB_OUTPUT"
            echo "site/exams/${TODAY}.json already exists; skipping generation."
          fi

      - name: Set up Python
        if: steps.exam.outputs.generate == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.exam.outputs.generate == 'true'
        run: pip install -r requirements.txt

      - name: Generate today's evening exam
        if: steps.exam.outputs.generate == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_evening_exam.py

      - name: Commit generated exam
        if: steps.exam.outputs.generate == 'true'
        run: |
          git config user.name "jpt-study-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/exams
          git diff --cached --quiet || git commit -m "Add JPT evening exam $(TZ=Asia/Taipei date +'%Y-%m-%d')"
          git push
