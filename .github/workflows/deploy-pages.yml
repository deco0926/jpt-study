name: Deploy JPT site

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "site/lessons/**"
  schedule:
    # 01:10 UTC = 09:10 Taiwan time (Asia/Taipei)
    - cron: "10 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify today's scheduled lesson
        if: github.event_name == 'schedule'
        run: |
          TODAY="$(TZ=Asia/Taipei date +'%Y-%m-%d')"
          test -f "site/lessons/${TODAY}.json"
          grep -q "\"date\": \"${TODAY}\"" site/lessons/latest.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
